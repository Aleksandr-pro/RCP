name: Temporary shader export
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK and compile
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;26.1.10909125'
          GLSLC="$ANDROID_HOME/ndk/26.1.10909125/shader-tools/linux-x86_64/glslc"
          for stage in vert frag; do
            "$GLSLC" "ATLAS/app/src/main/shaders/triangle.$stage" -o "$RUNNER_TEMP/$stage.spv"
            echo "::notice title=SPV-$stage::$(base64 -w0 "$RUNNER_TEMP/$stage.spv")"
          done
