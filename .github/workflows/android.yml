name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if ! "$SDKMANAGER" 'platforms;android-34' 'ndk;26.1.10909125' 'cmake;3.22.1' > sdk-install.log 2>&1; then
            echo "::error::Android SDK install failed: $(tail -c 3000 sdk-install.log)"
            exit 1
          fi
      - name: Build debug APK
        working-directory: ATLAS
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-0.1-debug
          path: ATLAS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
