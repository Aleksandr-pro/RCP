name: Android APK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "ndk;26.1.10909125" "cmake;3.22.1"'
      - name: Test loaders and physics
        run: |
          python3 .github/scripts/test-mesh-loader.py
          python3 .github/scripts/test-scene-loader.py
          python3 .github/scripts/test-texture-loader.py
          g++ -std=c++17 -Wall -Wextra -Werror .github/tests/test-physics.cpp ATLAS/app/src/main/cpp/physics/VerticalPhysics.cpp -o /tmp/test-physics
          /tmp/test-physics
          g++ -std=c++17 -Wall -Wextra -Werror .github/tests/test-bounce.cpp ATLAS/app/src/main/cpp/physics/VerticalPhysics.cpp -o /tmp/test-bounce
          /tmp/test-bounce
      - name: Verify SPIR-V
        run: |
          GLSLC="$ANDROID_HOME/ndk/26.1.10909125/shader-tools/linux-x86_64/glslc"
          for stage in vert frag; do
            "$GLSLC" "ATLAS/app/src/main/shaders/triangle.$stage" -o "$RUNNER_TEMP/triangle.$stage.spv"
            cmp "$RUNNER_TEMP/triangle.$stage.spv" "ATLAS/app/src/main/assets/shaders/triangle.$stage.spv"
          done
      - name: Build debug APK
        working-directory: ATLAS
        run: ./gradlew assembleDebug
      - name: Verify packaged assets
        run: |
          python3 - <<'PYCODE'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('ATLAS/app/build/outputs/apk/debug/app-debug.apk') as apk:
              for name in ('shaders/triangle.vert.spv', 'shaders/triangle.frag.spv', 'textures/ornament.rgba', 'scenes/physics.atlasscene', 'models/cube.atlasmesh'):
                  assert apk.read('assets/' + name) == Path('ATLAS/app/src/main/assets/' + name).read_bytes(), name
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS-0.26c-debug
          path: ATLAS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  signed-apk:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
      ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
      ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
      ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build signed APK when signing secrets are configured
        if: env.KEYSTORE_BASE64 != ''
        working-directory: ATLAS
        run: |
          set -euo pipefail
          export ATLAS_KEYSTORE_PATH="$RUNNER_TEMP/atlas-signing.p12"
          trap 'rm -f "$ATLAS_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ATLAS_KEYSTORE_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'ndk;26.1.10909125' 'cmake;3.22.1'
          ./gradlew assembleRelease
      - name: Upload signed APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-signed-release
          path: ATLAS/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  emulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 5ca6408917e751e0f0909832a324435e184c30b4
          path: reference-0.26b
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "ndk;26.1.10909125" "cmake;3.22.1"'
      - name: Build previous APK
        working-directory: reference-0.26b/ATLAS
        env:
          ATLAS_TEST_ABI: x86_64
        run: ./gradlew assembleDebug
      - name: Instrument physics and build emulator variants
        env:
          ATLAS_TEST_ABI: x86_64
        run: |
          python3 .github/scripts/instrument-physics-test.py
          (cd ATLAS && ./gradlew assembleDebug)
          cp ATLAS/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/physics-normal.apk"
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('ATLAS/app/src/main/assets/textures/ornament.rgba')
          path.write_bytes(bytes((255, 0, 255, 255)) * (1024 * 559))
          PYCODE
          (cd ATLAS && ./gradlew assembleDebug)
          cp ATLAS/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/physics-alternate.apk"
          git checkout -- ATLAS/app/src/main/assets/textures/ornament.rgba
          python3 .github/scripts/reverse-test-light.py ATLAS/app/src/main/cpp/renderer/VulkanRenderer.cpp
          (cd ATLAS && ./gradlew assembleDebug)
          cp ATLAS/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/physics-reverse-light.apk"
      - name: Enable KVM and install image tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 -m pip install --user --break-system-packages Pillow
      - name: Test physics and lifecycle on emulator
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/physics-emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-physics-diagnostics
          path: physics-diagnostics/
          if-no-files-found: ignore

  orientation-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build components
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Build emulator APK
        working-directory: ATLAS
        env:
          ATLAS_TEST_ABI: x86_64
        run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install image library
        run: python3 -m pip install --user --break-system-packages Pillow
      - name: Collect orientation diagnostics
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/orientation-diagnostics.sh
      - name: Upload orientation screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orientation-diagnostics
          path: orientation-diagnostics/
          if-no-files-found: ignore
