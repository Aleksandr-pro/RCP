name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if ! "$SDKMANAGER" 'platforms;android-34' 'ndk;26.1.10909125' 'cmake;3.22.1' > sdk-install.log 2>&1; then
            echo "::error::Android SDK install failed: $(tail -c 3000 sdk-install.log)"
            exit 1
          fi
      - name: Compile shaders
        run: |
          GLSLC="$ANDROID_HOME/ndk/26.1.10909125/shader-tools/linux-x86_64/glslc"
          for stage in vert frag; do
            "$GLSLC" "ATLAS/app/src/main/shaders/triangle.$stage" -o "$RUNNER_TEMP/triangle.$stage.spv"
            cmp "$RUNNER_TEMP/triangle.$stage.spv" "ATLAS/app/src/main/assets/shaders/triangle.$stage.spv"
          done
      - name: Build debug APK
        working-directory: ATLAS
        run: |
          if ! ./gradlew assembleDebug > "$RUNNER_TEMP/atlas-build.log" 2>&1; then
            tail -n 40 "$RUNNER_TEMP/atlas-build.log" | while IFS= read -r line; do
              echo "::notice::$line"
            done
            echo '::error::Android APK build failed; see notices above'
            exit 1
          fi
      - name: Verify APK contains shader assets
        run: |
          python3 - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile('ATLAS/app/build/outputs/apk/debug/app-debug.apk') as apk:
              for stage in ('vert', 'frag'):
                  asset = f'assets/shaders/triangle.{stage}.spv'
                  with open(f'ATLAS/app/src/main/{asset}', 'rb') as expected:
                      assert apk.read(asset) == expected.read(), asset
          PYCODE
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-0.8-debug
          path: ATLAS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-apk:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
      ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
      ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
      ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build signed APK when signing secrets are configured
        if: env.KEYSTORE_BASE64 != ''
        working-directory: ATLAS
        run: |
          set -euo pipefail
          export ATLAS_KEYSTORE_PATH="$RUNNER_TEMP/atlas-signing.p12"
          trap 'rm -f "$ATLAS_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ATLAS_KEYSTORE_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'ndk;26.1.10909125' 'cmake;3.22.1'
          ./gradlew assembleRelease
      - name: Upload signed APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-signed-release
          path: ATLAS/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  emulator-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build components
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Build emulator APK
        working-directory: ATLAS
        env:
          ATLAS_TEST_ABI: x86_64
        run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install image inspection tool
        run: python3 -m pip install --user --break-system-packages Pillow
      - name: Test on Android emulator
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/emulator-test.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: |
            atlas-log.txt
            atlas-errors.txt
            atlas-system-log.txt
            atlas-screen.png
            portrait.png
            landscape.png
            landscape-reverse.png
            portrait.json
            landscape.json
            landscape-reverse.json
          if-no-files-found: ignore

  orientation-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build components
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Build emulator APK
        working-directory: ATLAS
        env:
          ATLAS_TEST_ABI: x86_64
        run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install image library
        run: python3 -m pip install --user --break-system-packages Pillow
      - name: Collect orientation diagnostics
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/orientation-diagnostics.sh
      - name: Upload orientation screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orientation-diagnostics
          path: orientation-diagnostics/
          if-no-files-found: ignore

  matrix-comparison:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check if this is the matrix comparison version
        id: version
        run: |
          if grep -q 'versionName "0.8"' ATLAS/app/build.gradle; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the ATLAS 0.7 reference
        if: steps.version.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: 3a5ed6d62d9be8e18c7ba21b91316f3f0f891930
          path: reference-0.7
      - uses: actions/setup-java@v5
        if: steps.version.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build components
        if: steps.version.outputs.enabled == 'true'
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Build both emulator APKs
        if: steps.version.outputs.enabled == 'true'
        env:
          ATLAS_TEST_ABI: x86_64
        run: |
          (cd reference-0.7/ATLAS && ./gradlew assembleDebug)
          (cd ATLAS && ./gradlew assembleDebug)
      - name: Enable KVM and install image library
        if: steps.version.outputs.enabled == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 -m pip install --user --break-system-packages Pillow
      - name: Prepare comparison script
        if: steps.version.outputs.enabled == 'true'
        run: |
          cat > "$RUNNER_TEMP/depth-test.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p depth-comparison
          package=com.atlas.engine
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 0
          adb install -r reference-0.7/ATLAS/app/build/outputs/apk/debug/app-debug.apk
          adb logcat -c
          adb shell am start -n "$package/android.app.NativeActivity"
          sleep 10
          adb exec-out screencap -p > depth-comparison/before-portrait.png
          python3 .github/scripts/check-screen.py depth-comparison/before-portrait.png before
          adb shell settings put system user_rotation 1
          sleep 8
          adb exec-out screencap -p > depth-comparison/before-landscape.png
          python3 .github/scripts/check-screen.py depth-comparison/before-landscape.png before-landscape
          adb shell am force-stop "$package"
          adb install -r ATLAS/app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -n "$package/android.app.NativeActivity"
          sleep 10
          adb exec-out screencap -p > depth-comparison/after-landscape.png
          python3 .github/scripts/check-screen.py depth-comparison/after-landscape.png after-landscape
          adb shell settings put system user_rotation 0
          sleep 8
          adb exec-out screencap -p > depth-comparison/after-portrait.png
          python3 .github/scripts/check-screen.py depth-comparison/after-portrait.png after
          adb logcat -d -s ATLAS:I '*:S' > depth-comparison/atlas-log.txt
          grep -q 'Vulkan: буфер глубины создан, формат' depth-comparison/atlas-log.txt
          grep -q 'Vulkan: кадр успешно отправлен на экран' depth-comparison/atlas-log.txt
          python3 - <<'PYCODE'
          from PIL import Image, ImageChops
          for orientation in ('portrait', 'landscape'):
              before = Image.open(f'depth-comparison/before-{orientation}.png').convert('RGB')
              after = Image.open(f'depth-comparison/after-{orientation}.png').convert('RGB')
              assert before.size == after.size, f'Different dimensions for {orientation}'
              w, h = before.size
              # Exclude Android status and navigation bars; compare the rendered area.
              crop = (w // 20, h // 10, w * 19 // 20, h * 9 // 10)
              before = before.crop(crop)
              after = after.crop(crop)
              diff = ImageChops.difference(before, after)
              changed = sum(1 for pixel in diff.getdata() if max(pixel) > 20)
              total = before.width * before.height
              fraction = changed / total
              print(f'{orientation}: {changed}/{total} substantially changed pixels ({fraction:.3%})')
              if fraction > 0.005:
                  raise AssertionError(f'{orientation} faces changed significantly: {fraction:.3%}')
          PYCODE
          SCRIPT
          chmod +x "$RUNNER_TEMP/depth-test.sh"
      - name: Compare 0.7 and 0.8 on Android emulator
        if: steps.version.outputs.enabled == 'true'
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/depth-test.sh"
      - name: Upload before and after screenshots
        if: always() && steps.version.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-matrix-comparison
          path: depth-comparison/
          if-no-files-found: ignore
