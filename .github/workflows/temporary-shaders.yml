name: Temporary shader compilation
on: [push]
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Compile shaders
        run: |
          set -e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;26.1.10909125' > /dev/null
          echo '' | base64 -d > /tmp/a.vert
          echo '' | base64 -d > /tmp/a.frag
          for stage in vert frag; do
            "$ANDROID_HOME/ndk/26.1.10909125/shader-tools/linux-x86_64/glslc" "/tmp/a.$stage" -o "/tmp/a.$stage.spv"
            echo "::notice title=shader-$stage::$(base64 -w 0 /tmp/a.$stage.spv)"
          done
