name: Export city geometry
on: workflow_dispatch
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Generate and export geometry
        env:
          ATLAS_CITY_OUTPUT: ${{ runner.temp }}/city-atlas
        run: |
          blender -b --threads 2 --python-exit-code 77 --python ATLAS/city-source/city_blender.py --python ATLAS/city-source/export_atlas.py
          tar -czf "$RUNNER_TEMP/city-atlas.tar.gz" -C "$RUNNER_TEMP/city-atlas" .
          python3 - <<'PYCODE'
          import base64,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'city-blob.json').write_text(json.dumps({'content':base64.b64encode((p/'city-atlas.tar.gz').read_bytes()).decode(), 'encoding':'base64'}))
          PYCODE
      - name: Publish export as an unreferenced Git blob for retrieval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/city-blob.json" --jq .sha)
          echo "::notice title=ATLAS city export blob::$SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS-city-export
          path: ${{ runner.temp }}/city-atlas/
