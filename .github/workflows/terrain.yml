name: Terrain emulator
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  terrain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "ndk;26.1.10909125" "cmake;3.22.1"'
      - name: Build emulator APK and test-only input helper
        env:
          ATLAS_TEST_ABI: x86_64
        run: |
          python3 .github/scripts/instrument-terrain-body.py
          (cd ATLAS && ./gradlew assembleDebug)
          mkdir -p "$RUNNER_TEMP/terrain-classes" "$RUNNER_TEMP/terrain-dex"
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-34/android.jar" -d "$RUNNER_TEMP/terrain-classes" .github/scripts/TerrainInput.java
          D8=$(find "$ANDROID_HOME/build-tools" -name d8 -type f | sort -V | tail -n 1)
          "$D8" --min-api 26 --output "$RUNNER_TEMP/terrain-dex" "$RUNNER_TEMP/terrain-classes/TerrainInput.class"
          (cd "$RUNNER_TEMP/terrain-dex" && jar cf "$RUNNER_TEMP/terrain.jar" classes.dex)
      - name: Enable KVM and install image library
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 -m pip install --user --break-system-packages Pillow
      - name: Exercise world scene on emulator
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/terrain-emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-diagnostics
          path: terrain-diagnostics/
          if-no-files-found: ignore
