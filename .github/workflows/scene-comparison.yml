name: Camera touch test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-touch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build components
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Add test-only touch tracing and build emulator APK
        env:
          ATLAS_TEST_ABI: x86_64
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('ATLAS/app/src/main/cpp/main.cpp')
          source = path.read_text()
          needle = '                const float deltaX = currentX - state->lastTouchX;'
          assert source.count(needle) == 1
          source = source.replace(needle, needle + '\n                const float testBefore = state->angle;')
          needle = '                    state->angle = std::fmod(state->angle, fullTurn);'
          assert source.count(needle) == 1
          source = source.replace(needle, needle + '\n                    __android_log_print(ANDROID_LOG_INFO, "ATLAS_TOUCH_TEST", "move dx=%.4f width=%d before=%.6f after=%.6f", deltaX, windowWidth, testBefore, state->angle);')
          needle = '            case AMOTION_EVENT_ACTION_CANCEL:\n            {\n                state->touchActive = false;'
          assert source.count(needle) == 1
          source = source.replace(needle, '            case AMOTION_EVENT_ACTION_CANCEL:\n            {\n                __android_log_print(ANDROID_LOG_INFO, "ATLAS_TOUCH_TEST", "end action=%d active=%d", actionMasked, state->touchActive);\n                state->touchActive = false;')
          needle = '                    const float deltaY = currentY - state->lastTouchY;'
          assert source.count(needle) == 1
          source = source.replace(needle, needle + '\n                    const float testBeforeTilt = state->tiltAngle;')
          needle = '                        state->tiltAngle = std::clamp(\n                            state->tiltAngle,\n                            -maxTilt,\n                            maxTilt\n                        );'
          assert source.count(needle) == 1
          source = source.replace(needle, needle + '\n                        __android_log_print(ANDROID_LOG_INFO, "ATLAS_TOUCH_TEST", "move2 dx=%.4f dy=%.4f width=%d height=%d before=%.6f after=%.6f", deltaX, deltaY, windowWidth, windowHeight, testBeforeTilt, state->tiltAngle);')
          needle = '                state->hasFocus = false;'
          assert source.count(needle) == 1
          source = source.replace(needle, needle + '\n                __android_log_print(ANDROID_LOG_INFO, "ATLAS_TOUCH_TEST", "lost focus active=%d", state->touchActive);')
          needle = '                state->activePointerId = -1;\n                logInfo("ATLAS: окно потеряло фокус.");'
          assert source.count(needle) == 1
          source = source.replace(needle, '                state->activePointerId = -1;\n                __android_log_print(ANDROID_LOG_INFO, "ATLAS_TOUCH_TEST", "focus reset active=%d id=%d", state->touchActive, state->activePointerId);\n                logInfo("ATLAS: окно потеряло фокус.");')
          path.write_text(source)
          PYCODE
          (cd ATLAS && ./gradlew assembleDebug)
      - name: Enable KVM and install image library
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 -m pip install --user --break-system-packages Pillow
      - name: Test camera gestures on emulator
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/scene-comparison.sh
      - name: Upload touch screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-camera-touch-diagnostics
          path: scene-comparison/
          if-no-files-found: ignore
