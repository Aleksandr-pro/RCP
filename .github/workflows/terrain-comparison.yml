name: Terrain variation comparison
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "ndk;26.1.10909125" "cmake;3.22.1"'
      - name: Build matched comparison APKs
        env:
          ATLAS_TEST_ABI: x86_64
        run: |
          python3 .github/scripts/instrument-comparison.py
          (cd ATLAS && ./gradlew assembleDebug)
          cp ATLAS/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/terrain-varied.apk"
          GLSLC="$ANDROID_HOME/ndk/26.1.10909125/shader-tools/linux-x86_64/glslc"
          "$GLSLC" -fshader-stage=frag .github/fixtures/terrain-0.27e.frag -o ATLAS/app/src/main/assets/shaders/triangle.frag.spv
          (cd ATLAS && ./gradlew assembleDebug)
          cp ATLAS/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/terrain-reference.apk"
          mkdir -p "$RUNNER_TEMP/compare-classes" "$RUNNER_TEMP/compare-dex"
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-34/android.jar" -d "$RUNNER_TEMP/compare-classes" .github/scripts/TerrainInput.java .github/scripts/PinchInput.java
          D8=$(find "$ANDROID_HOME/build-tools" -name d8 -type f | sort -V | tail -n 1)
          "$D8" --min-api 26 --output "$RUNNER_TEMP/compare-dex" "$RUNNER_TEMP/compare-classes/TerrainInput.class" "$RUNNER_TEMP/compare-classes/PinchInput.class"
          (cd "$RUNNER_TEMP/compare-dex" && jar cf "$RUNNER_TEMP/compare.jar" classes.dex)
      - name: Enable KVM and image tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 -m pip install --user --break-system-packages Pillow
      - name: Compare matched scenes and world zoom
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/terrain-variation-compare.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-variation-comparison
          path: terrain-variation-comparison/
          if-no-files-found: ignore
  phone-apks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "ndk;26.1.10909125" "cmake;3.22.1"'
      - name: Build two equally signed phone APKs
        run: |
          mkdir -p comparison-apks
          (cd ATLAS && ./gradlew assembleDebug)
          cp ATLAS/app/build/outputs/apk/debug/app-debug.apk comparison-apks/ATLAS-0.27f-varied.apk
          GLSLC="$ANDROID_HOME/ndk/26.1.10909125/shader-tools/linux-x86_64/glslc"
          "$GLSLC" -fshader-stage=frag .github/fixtures/terrain-0.27e.frag -o ATLAS/app/src/main/assets/shaders/triangle.frag.spv
          (cd ATLAS && ./gradlew assembleDebug)
          cp ATLAS/app/build/outputs/apk/debug/app-debug.apk comparison-apks/ATLAS-0.27f-reference-0.27e-shader.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          for apk in comparison-apks/*.apk; do "$APKSIGNER" verify --print-certs "$apk"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS-0.27f-comparison-phone-apks
          path: comparison-apks/*.apk
          if-no-files-found: error
