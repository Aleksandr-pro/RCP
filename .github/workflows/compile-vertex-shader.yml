name: Compile vertex shader for ATLAS 0.24
on:
  push:
    branches: [arena/b19a0332-rcp]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile vertex shader with Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;26.1.10909125' > /dev/null
          "$ANDROID_HOME/ndk/26.1.10909125/shader-tools/linux-x86_64/glslc" ATLAS/app/src/main/shaders/triangle.vert -o "$RUNNER_TEMP/triangle.vert.spv"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          data = base64.b64encode((Path(os.environ['RUNNER_TEMP']) / 'triangle.vert.spv').read_bytes()).decode()
          for i in range(0, len(data), 1500):
              print(f'::notice title=shader-{i // 1500}::{data[i:i+1500]}')
          PY
