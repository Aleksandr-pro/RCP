plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.atlas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.atlas'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}
