plugins {
    id "com.android.application"
}

android {
    namespace "com.atlas.engine"

    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.atlas.engine"

        minSdk 26
        targetSdk 34

        versionCode 1
        versionName "0.1.0"

        ndk {
            // Первая сборка только для 64-битных ARM-телефонов.
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
