plugins {
    id "com.android.application"
}

android {
    namespace "com.atlas.engine"

    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.atlas.engine"

        minSdk 26
        targetSdk 34

        versionCode 17
        versionName "0.12"

        ndk {
            // Первая сборка только для 64-битных ARM-телефонов.
            abiFilters (System.getenv("ATLAS_TEST_ABI") ?: "arm64-v8a")
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    signingConfigs {
        // Public test key: stable updates for test APKs, not for production releases.
        debug {
            storeFile file("keys/atlas-test.p12")
            storeType "PKCS12"
            storePassword "android"
            keyAlias "atlas-test"
            keyPassword "android"
        }
        release {
            if (System.getenv("ATLAS_KEYSTORE_PATH")) {
                storeFile file(System.getenv("ATLAS_KEYSTORE_PATH"))
                storePassword System.getenv("ATLAS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ATLAS_KEY_ALIAS")
                keyPassword System.getenv("ATLAS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
